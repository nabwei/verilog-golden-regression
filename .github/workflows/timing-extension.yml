name: VHDL AXI and robot timing extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ghdl g++
      - run: python fetch_robot_dependency.py
      - run: python 01_FPGA_EMBEDDED/run_tests.py
      - run: python 01_FPGA_EMBEDDED/verify_reproducibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-extension-evidence
          path: 08_TEST_RESULTS/fpga/
