name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: iverilog -V && python run_tests.py
      - run: yosys -p 'read_verilog rtl/pattern_new.v; hierarchy -check -top pattern_new; synth -top pattern_new; check -assert'
